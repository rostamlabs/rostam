# Release binaries for rostam-server.
#
# CGO_ENABLED=0 ON PURPOSE. The full build links wasmtime-go for WASM stored
# procedures, and cgo cannot be cross-compiled from one runner without a
# per-target C toolchain. Everything else — vector search, the KV store,
# clustering, and all three transports — is pure Go and identical in these
# builds; only stored procedures are unavailable, and they fail loudly with
# "wasm: stored procedures require a cgo build" rather than misbehaving.
# Users who need them have two supported paths. The container image always
# carries cgo. `go install` carries it only when the build has cgo on — a native
# build (cgo defaults off when cross-compiling) on a machine with a C compiler:
#   go install github.com/rostamlabs/rostam/cmd/rostam-server@latest
version: 2

project_name: rostam

# The Python client releases on its own `py-v*` tags. Without this filter
# goreleaser takes the most recent tag of ANY shape as the version, so a client
# release silently renames the next engine release's artifacts — a snapshot
# build produced "rostam-server_py-v0.1.0-SNAPSHOT_linux_amd64.tar.gz".
git:
  ignore_tags:
    - "py-v*"

before:
  hooks:
    - go mod download
    # Builds the Vite dashboard and syncs it into dashboard/dist/ (the
    # go:embed'd tree) so a released binary ships the real UI instead of the
    # unbuilt placeholder. Requires Node/npm on the release runner's PATH.
    - make ui

builds:
  - id: rostam-server
    main: ./cmd/rostam-server
    binary: rostam-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # -X ...buildinfo.version is what makes `rostam-server -version` and the MCP
    # server's initialize response both report the release
    # tag instead of the pseudo-version Go derives for an untagged build.
    ldflags:
      - -s -w -X github.com/rostamlabs/rostam/internal/buildinfo.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      # No demand demonstrated, and each combination is another artifact to
      # verify. Add them when someone asks.
      - goos: windows
        goarch: arm64
      - goos: freebsd
        goarch: arm64

archives:
  - id: default
    name_template: >-
      rostam-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Ship the licence and NOTICE inside the archive: Apache-2.0 §4 asks a
    # redistributor to carry both, and a downloaded tarball is a redistribution.
    files:
      - README.md
      - LICENSE
      - NOTICE
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    # Go toolchain (includes WASM stored procedures when it builds with cgo)
    go install github.com/rostamlabs/rostam/cmd/rostam-server@{{ .Tag }}

    # Container (always a cgo build; authentication is required)
    docker run -p 127.0.0.1:8080:8080 -e ROSTAM_API_KEY=secret ghcr.io/rostamlabs/rostam:{{ .Tag }}

    # In-process local embeddings (pure Go, no ONNX Runtime): just set the model
    # (REMBED_CACHE on a mounted volume persists downloaded weights across restarts)
    docker run -p 127.0.0.1:8080:8080 -e ROSTAM_API_KEY=secret \
      -e ROSTAM_EMBED_LOCAL=minilm-l6-v2 -e REMBED_CACHE=/models -v rostam-models:/models \
      ghcr.io/rostamlabs/rostam:{{ .Tag }}
    ```

    The binaries attached below are **pure-Go builds**: everything works except
    WASM stored procedures, which return `wasm: stored procedures require a cgo
    build`. The container image always includes them. `go install` includes them
    only when it builds with cgo — a native build (cgo defaults off when
    cross-compiling) on a machine with a C compiler. In-process local embeddings
    (rembed) are pure Go and built into every binary and image — no build tag,
    no ONNX Runtime, nothing to install.

    Verify a download against `checksums.txt`:

    ```sh
    sha256sum -c checksums.txt --ignore-missing        # Linux
    shasum -a 256 -c checksums.txt --ignore-missing    # macOS
    ```
