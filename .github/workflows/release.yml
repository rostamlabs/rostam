name: release

# Publishes release binaries and the container image for a `v*` tag.
#
# The Python client releases separately on `py-v*` (publish-python.yml) because
# it versions independently of the engine — a client fix should not require an
# engine release, and vice versa. The two tag patterns do not overlap.

on:
  push:
    tags: ["v*"]
  # Lets an existing tag be released after the fact — the v0.1.0 tag predates
  # this workflow and has no binaries attached.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  # A manual dispatch takes inputs.tag straight into actions/checkout as the
  # ref, and the build then runs `make ui` (npm lifecycle scripts) and a
  # Docker build — both execute code from that ref with privileged tokens
  # (contents: write, packages: write). Reject anything that is not a release
  # tag BEFORE either job checks out the ref, so a dispatch against an
  # arbitrary branch/SHA cannot run untrusted code with those credentials.
  # Skipped entirely on the normal `push: tags: v*` trigger, where the ref is
  # already a real tag by construction.
  validate-tag:
    name: validate release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reject a non-release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "::error::inputs.tag '$TAG' is not a release tag (expected vX.Y.Z, e.g. v0.1.0 or v0.1.0-rc1)"
            exit 1
          fi

  binaries:
    name: binaries
    needs: [validate-tag]
    if: ${{ always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser derives the version and changelog from tag history, so a
          # shallow clone produces a wrong version and an empty changelog.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # goreleaser's before.hooks run `make ui` (builds the Vite dashboard and
      # syncs it into dashboard/dist/), which needs npm on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Multi-arch image, built NATIVELY on each architecture. The alternative —
  # one runner emulating arm64 through QEMU — compiles wasmtime under emulation,
  # which turns a ~3 minute build into tens of minutes. GitHub provides arm64
  # runners free for public repositories, so there is no reason to emulate.
  #
  # Each architecture pushes an untagged manifest by digest; the merge job below
  # combines those digests into one tagged manifest list. That is the standard
  # buildx pattern for native multi-arch and the reason the tags are applied
  # once, at merge time, rather than twice and racing.
  image:
    name: image (${{ matrix.platform }})
    needs: [validate-tag]
    if: ${{ always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The context is copied into the image (COPY . .) and layers are
          # exported to the build cache; do not persist GITHUB_TOKEN in .git,
          # where it could leak into a cached layer.
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only — the tags are applied once, at merge time. Without this the
      # per-platform images carry no OCI provenance, and
      # org.opencontainers.image.source is what links the package to this repo.
      - id: labels
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/rostam-server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.labels.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  image-manifest:
    name: image manifest
    needs: image
    # Explicit condition, not the implicit success(): the `image` job carries an
    # always()-guarded `if`, and on a tag push the upstream validate-tag job is
    # skipped — that combination poisons a downstream default success() check and
    # silently SKIPS this job, so the per-arch digests never get combined into the
    # tagged `:vX.Y.Z` / `:latest` manifest (the binaries still publish, so the gap
    # is easy to miss). Gate on image succeeding regardless of how validate-tag
    # resolved, matching the always() pattern the binaries/image jobs already use.
    if: ${{ always() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Four tags per release:
          #   0.1.1     type=semver strips the leading v
          #   0.1       the minor series
          #   v0.1.1    the form people read off the releases page — v0.1.1's
          #             notes pointed at :v0.1.1, which did not exist
          #   latest    only on a real tag push, so re-releasing an OLD tag by
          #             hand cannot drag latest backwards. Gated on the event
          #             rather than on inputs.tag: the inputs context is unset
          #             for a push, and relying on how that coerces in a
          #             comparison is not worth the ambiguity.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Verify both architectures are present
        run: |
          got=$(docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}" \
            --format '{{ json .Manifest }}' \
            | jq -r '.manifests[].platform | select(.architecture != "unknown") | .os + "/" + .architecture' \
            | sort -u)
          echo "published platforms:"; echo "$got" | sed 's/^/  /'
          for want in linux/amd64 linux/arm64; do
            echo "$got" | grep -qx "$want" || { echo "::error::$want missing from the manifest list"; exit 1; }
          done
        env:
          VERSION: ${{ steps.meta.outputs.version }}
