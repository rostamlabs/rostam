name: test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # The heavy multi-node-cluster packages (root `.`, `./inttest/`, `./cluster/`
  # and `./shard/`) each stand up 3-node RF=3 Raft clusters whose bring-up needs
  # a whole 2-core runner to itself: cluster/node.go staggers each cluster's cold
  # elections to GOMAXPROCS, but that only works if a SECOND heavy package is not
  # oversubscribing the same runner in parallel. So they run in their own jobs
  # (concurrent on separate runners) instead of `go test -p 2 ./...`, which used
  # to overlap them on one runner and thrash elections into flakes.
  #
  # `cluster` and `shard` were originally left in the shared -p 2 lane despite
  # also building 3-node clusters, and flaked there non-deterministically (a
  # different test failing per run: wasm-registration dispatch, a 256-shard
  # construction deadline, a raft commit losing leadership). They are isolated
  # here for the same reason as root/inttest.
  test-unit:
    name: build, vet + unit/light packages
    runs-on: ubuntu-latest
    env:
      # The wasm stored-procedure backend (wasmtime) requires cgo.
      # wasmtime-go ships a prebuilt static lib, so gcc on the runner is enough.
      # The GPU index is behind `-tags cuda` and is intentionally not tested here.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build (default, cgo)
        run: go build ./...

      - name: Build pure-Go packages without cgo
        run: CGO_ENABLED=0 go build ./vector/... ./objstore ./cache ./ops

      - name: Vet
        run: go vet ./...

      - name: Snapshot the working tree
        # Taken BEFORE the tests so the check below compares what the run created,
        # not what a fresh checkout already contains.
        id: tree-snapshot
        run: git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-before.txt

      - name: Test (light packages)
        # Everything EXCEPT the heavy cluster packages, which run isolated below.
        run: go test -p 2 -timeout 15m $(go list ./... | grep -vE '/rostam$|/rostam/inttest$|/rostam/cluster$|/rostam/shard$')
      - name: Tests must not write into the checkout
        # A test that persists into the repo is invisible to CI otherwise: a runner
        # is always the FIRST run, so self-poisoning state never surfaces here, and
        # gotestsum --rerun-fails retries straight past it. That combination hid a
        # store writing ./vectors/ into the working directory (#8/#9) while every
        # job stayed green and the same suite failed on a second local run.
        #
        # Ignored files must be included: the directory in question was gitignored,
        # so a plain `git status --porcelain` check sees nothing at all. And it must
        # be FILE-level (traditional + untracked-files=all), because --ignored=matching
        # collapses an ignored directory to one entry — with `vectors/` already
        # present, a test adding `vectors/default/new.json` leaves both snapshots
        # byte-identical and the guard reports success.
        #
        # Diffing against the pre-test snapshot keeps pre-existing ignored files out
        # of it, so only paths the run CREATED can fail this.
        if: ${{ always() && steps.tree-snapshot.outcome == 'success' }}
        run: |
          git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt > /tmp/tree.diff; then
            echo "::error::the test run wrote into the checkout — see the diff below"
            cat /tmp/tree.diff
            exit 1
          fi
          echo "working tree unchanged by the test run"


  test-root:
    name: root-package integration tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Snapshot the working tree
        # Taken BEFORE the tests so the check below compares what the run created,
        # not what a fresh checkout already contains.
        id: tree-snapshot
        run: git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-before.txt

      - name: Test (root package, isolated)
        # Alone on the runner: its 3-node cluster tests get both cores for bring-up.
        # gotestsum reruns a transiently-failed test up to twice: the heavy RF=3
        # cluster tests occasionally miss even widened deadlines when the shared
        # runner is pathologically contended (~50x slowdown on a bad draw), yet
        # pass in seconds in isolation. A genuine break fails all 3 attempts; if
        # >10 distinct tests fail it's treated as a real break and not rerun.
        run: gotestsum --rerun-fails=2 --packages=. -- -timeout 20m
      - name: Tests must not write into the checkout
        # A test that persists into the repo is invisible to CI otherwise: a runner
        # is always the FIRST run, so self-poisoning state never surfaces here, and
        # gotestsum --rerun-fails retries straight past it. That combination hid a
        # store writing ./vectors/ into the working directory (#8/#9) while every
        # job stayed green and the same suite failed on a second local run.
        #
        # Ignored files must be included: the directory in question was gitignored,
        # so a plain `git status --porcelain` check sees nothing at all. And it must
        # be FILE-level (traditional + untracked-files=all), because --ignored=matching
        # collapses an ignored directory to one entry — with `vectors/` already
        # present, a test adding `vectors/default/new.json` leaves both snapshots
        # byte-identical and the guard reports success.
        #
        # Diffing against the pre-test snapshot keeps pre-existing ignored files out
        # of it, so only paths the run CREATED can fail this.
        if: ${{ always() && steps.tree-snapshot.outcome == 'success' }}
        run: |
          git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt > /tmp/tree.diff; then
            echo "::error::the test run wrote into the checkout — see the diff below"
            cat /tmp/tree.diff
            exit 1
          fi
          echo "working tree unchanged by the test run"


  test-inttest:
    name: inttest integration tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Snapshot the working tree
        # Taken BEFORE the tests so the check below compares what the run created,
        # not what a fresh checkout already contains.
        id: tree-snapshot
        run: git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-before.txt

      - name: Test (inttest, isolated)
        # Alone on the runner: its 3-node cluster tests get both cores for bring-up.
        # gotestsum reruns transient failures (see test-root) — the inttest RF=3
        # cluster/reshard tests are the most bring-up-heavy and the most exposed to
        # a badly-contended shared runner; they pass in seconds in isolation.
        run: gotestsum --rerun-fails=2 --packages=./inttest/ -- -timeout 20m
      - name: Tests must not write into the checkout
        # A test that persists into the repo is invisible to CI otherwise: a runner
        # is always the FIRST run, so self-poisoning state never surfaces here, and
        # gotestsum --rerun-fails retries straight past it. That combination hid a
        # store writing ./vectors/ into the working directory (#8/#9) while every
        # job stayed green and the same suite failed on a second local run.
        #
        # Ignored files must be included: the directory in question was gitignored,
        # so a plain `git status --porcelain` check sees nothing at all. And it must
        # be FILE-level (traditional + untracked-files=all), because --ignored=matching
        # collapses an ignored directory to one entry — with `vectors/` already
        # present, a test adding `vectors/default/new.json` leaves both snapshots
        # byte-identical and the guard reports success.
        #
        # Diffing against the pre-test snapshot keeps pre-existing ignored files out
        # of it, so only paths the run CREATED can fail this.
        if: ${{ always() && steps.tree-snapshot.outcome == 'success' }}
        run: |
          git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt > /tmp/tree.diff; then
            echo "::error::the test run wrote into the checkout — see the diff below"
            cat /tmp/tree.diff
            exit 1
          fi
          echo "working tree unchanged by the test run"


  test-cluster:
    name: cluster package tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Snapshot the working tree
        # Taken BEFORE the tests so the check below compares what the run created,
        # not what a fresh checkout already contains.
        id: tree-snapshot
        run: git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-before.txt

      - name: Test (cluster, isolated)
        # Alone on the runner: its 3-node cluster tests get both cores for
        # bring-up. gotestsum reruns transient failures (see test-root).
        run: gotestsum --rerun-fails=2 --packages=./cluster/ -- -timeout 20m
      - name: Tests must not write into the checkout
        # A test that persists into the repo is invisible to CI otherwise: a runner
        # is always the FIRST run, so self-poisoning state never surfaces here, and
        # gotestsum --rerun-fails retries straight past it. That combination hid a
        # store writing ./vectors/ into the working directory (#8/#9) while every
        # job stayed green and the same suite failed on a second local run.
        #
        # Ignored files must be included: the directory in question was gitignored,
        # so a plain `git status --porcelain` check sees nothing at all. And it must
        # be FILE-level (traditional + untracked-files=all), because --ignored=matching
        # collapses an ignored directory to one entry — with `vectors/` already
        # present, a test adding `vectors/default/new.json` leaves both snapshots
        # byte-identical and the guard reports success.
        #
        # Diffing against the pre-test snapshot keeps pre-existing ignored files out
        # of it, so only paths the run CREATED can fail this.
        if: ${{ always() && steps.tree-snapshot.outcome == 'success' }}
        run: |
          git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt > /tmp/tree.diff; then
            echo "::error::the test run wrote into the checkout — see the diff below"
            cat /tmp/tree.diff
            exit 1
          fi
          echo "working tree unchanged by the test run"


  test-shard:
    name: shard package tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Snapshot the working tree
        # Taken BEFORE the tests so the check below compares what the run created,
        # not what a fresh checkout already contains.
        id: tree-snapshot
        run: git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-before.txt

      - name: Test (shard, isolated)
        # Alone on the runner: its in-memory 3-node raft clusters run with
        # deliberately aggressive election timings (scaled by cpuScaled) that a
        # co-tenant package would starve into spurious elections.
        run: gotestsum --rerun-fails=2 --packages=./shard/ -- -timeout 20m
      - name: Tests must not write into the checkout
        # See test-unit for why this exists and why the flags are what they are.
        if: ${{ always() && steps.tree-snapshot.outcome == 'success' }}
        run: |
          git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt > /tmp/tree.diff; then
            echo "::error::the test run wrote into the checkout — see the diff below"
            cat /tmp/tree.diff
            exit 1
          fi
          echo "working tree unchanged by the test run"


  test-windows:
    name: storage tests (windows/amd64)
    runs-on: windows-latest
    env:
      # Pure Go: wasmtime is the only cgo dependency and none of the packages
      # below reach it, so there is no C toolchain to arrange on the runner.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Windows is the only platform besides Linux that maps shard and slab files
      # (cache/mmap_windows.go, vector/mmap_windows.go), and a mapping bug there
      # is invisible to every other lane: the cross-compile matrix builds
      # windows/amd64 but never runs it, so the four persistence test files that
      # used to be linux-only would compile and never execute. These three
      # packages are the whole path a Windows user's data travels — the shard
      # files, the collections on top of them, and the MCP memory store that
      # reopens both.
      #
      # `go vet ./...` is deliberately not run here: the one conversion a file
      # mapping cannot avoid (MapViewOfFile hands back a uintptr, which has to
      # become a *byte) is exactly what vet's unsafeptr check reports, and it has
      # no way to express that an OS mapping address is not a Go pointer. The
      # ubuntu lane still vets everything that is not windows-tagged.
      - name: Test (storage + memory packages)
        run: go test -count=1 -timeout 30m ./cache/... ./mcp/...

      # The step above maps the CACHE slab on Windows, but the VECTOR mmap code
      # (vector/mmap_windows.go: openVecMmap/growVecMmap/syncVecMmap/... and the
      # level-0 graph slab) is only compile-checked here — the mcp test falls back
      # to heap-backed vectors (QuantInRAM, no MmapPath/GraphMmapPath), so a
      # Windows-specific mapping/grow/flush bug in the vector or graph slab would
      # ship undetected. Run a TARGETED slice of ./vector/ that hits the
      # open→grow→sync→close→reopen round-trip (mmap/persist/reopen/grow/reserve/
      # slab tests) — deliberately NOT the full vector suite. The -skip drops the
      # concurrent/latency grow tests: on a shared runner CPU oversubscription
      # makes those the flakiest, and they add no Windows-mapping coverage the
      # serial round-trip doesn't already give (they still run on the Linux lanes).
      - name: Test (vector mmap/persist round-trip, targeted)
        run: go test -count=1 -timeout 15m -run 'Mmap|Persist|Reopen|Grow|Reserve|Slab' -skip 'Concurrent|Latency|SIFT' ./vector/

      # The filesystem backup store publishes a write-once snapshot with a hard
      # link (CreateHardLinkW here), whose refusal of an existing name is what
      # makes concurrent backups at one timestamp publish exactly once. Linux
      # link(2) proves nothing about NTFS, so run the store's write paths,
      # including many writers racing for one key, on the real filesystem.
      #
      # Not run here: the tests that write a real backup key (the concurrent
      # backup test, and the stale-temp test's key). Those keys embed an
      # RFC 3339 timestamp, and its ':' is not a legal character in a Windows
      # file name, so FSObjectStore cannot store them on NTFS by rename or by
      # link alike. That is a key-layout limitation of the filesystem store on
      # Windows, separate from how an object is published; these tests run on
      # every other lane.
      - name: Test (filesystem backup store write paths, targeted)
        run: go test -count=1 -timeout 10m -run 'PutIfAbsent|TestFSObjectStorePut' -skip 'TestFSObjectStorePutReclaimsStaleTemps' ./backup/

  cgo-disabled-build:
    name: cgo-disabled build
    runs-on: ubuntu-latest
    env:
      # The engine must build under CGO_ENABLED=0 (the default for cross-compiles
      # and static/scratch containers). The wasmtime stored-procedure backend is
      # cgo-only and lives behind a `//go:build cgo` tag; a `//go:build !cgo` stub
      # (wasm/wasm_stub.go) keeps the wasm package's exported surface intact so
      # every importer still compiles. This job guards that split from regressing.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build (CGO_ENABLED=0)
        run: go build ./...

  cross-compile:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: 386
          - goos: windows
            goarch: amd64
          - goos: freebsd
            goarch: amd64
    env:
      # Build-only (no test compile, no run) across GOOS/GOARCH pairs the other
      # jobs never touch — they all build+test linux/amd64 only. This exists
      # because an untyped int constant sized from a uint32 max (cache/ringbuf.go's
      # maxValueLen) overflowed `int` on 32-bit and broke linux/386, linux/arm and
      # windows/386 silently: nothing in the linux/amd64-only lanes above could
      # ever catch it. CGO_ENABLED=0 because none of these targets have a cgo
      # toolchain here, and it's also the realistic case for cross-compiled /
      # static binaries of this engine.
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

  test-386:
    name: 32-bit tests (linux/386)
    runs-on: ubuntu-latest
    env:
      # A linux/386 test BINARY runs natively on an amd64 runner, so unlike the
      # build-only matrix above this lane actually EXECUTES the suite with a
      # 32-bit int.
      #
      # WHY THAT MATTERS. The wire decoders read lengths with
      # `int(binary.BigEndian.Uint32(...))`. On 64-bit that conversion is always
      # exact; on 32-bit a declared length above MaxInt32 widens NEGATIVE, and a
      # negative length SATISFIES the `len(args) < off+n` bounds checks that are
      # supposed to reject it — so the decode proceeds and panics on a slice
      # bound or a negative make(). There are ~180 such conversions in ops/
      # alone, and auditing them by hand is both laborious and unverifiable;
      # running the tests where the conversion actually misbehaves is neither.
      #
      # SCOPE. The packages that decode untrusted wire bytes. cache/ is
      # deliberately excluded: its default page budget exceeds a 32-bit process's
      # ~4 GiB address space and the suite dies of genuine OOM, which is a
      # property of the test config, not a defect. -short for the same reason the
      # race lane uses it.
      #
      # LIMIT, stated plainly: this catches a widening only where a test feeds a
      # length large enough to trigger it. It is a real net, not a proof — the
      # hostile-length cases in ops/wire_bounds_test.go are what make it catch
      # the class rather than only the paths that happen to see big values.
      CGO_ENABLED: "0"
      GOARCH: "386"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Snapshot the working tree
        # Taken BEFORE the tests so the check below compares what the run created,
        # not what a fresh checkout already contains.
        id: tree-snapshot
        run: git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-before.txt

      - name: Vet (32-bit int, whole module)
        # WIDER THAN THE TEST STEP BELOW, AND CHEAPER. vet type-checks every
        # package INCLUDING its _test.go files without building a test binary or
        # allocating anything, so it covers the packages the test step has to skip
        # — cache/ among them, whose page budget cannot fit a 32-bit address space.
        #
        # What it catches is the compile-time half of the widening class: an
        # untyped constant that does not fit a 32-bit int is a COMPILE error, so
        # the package simply cannot be built for 386 and no test lane ever reaches
        # it. Nothing else in CI compiles test files under GOARCH=386 — the
        # cross-compile matrix runs `go build`, which ignores them — so before this
        # step that breakage could only be found by hand.
        run: go vet ./...

      - name: Test (32-bit int)
        run: go test -count=1 -short -timeout 25m ./ops/... ./vector/... ./httpapi/... ./server/...
      - name: Tests must not write into the checkout
        # See test-unit for why this exists and why the flags are what they are.
        if: ${{ always() && steps.tree-snapshot.outcome == 'success' }}
        run: |
          git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt > /tmp/tree.diff; then
            echo "::error::the test run wrote into the checkout — see the diff below"
            cat /tmp/tree.diff
            exit 1
          fi
          echo "working tree unchanged by the test run"


  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      # -race requires cgo; same wasmtime rationale as the `test` job.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Snapshot the working tree
        # Taken BEFORE the tests so the check below compares what the run created,
        # not what a fresh checkout already contains.
        id: tree-snapshot
        run: git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-before.txt

      - name: Test (race detector)
        # Enforces the README's "race-clean" claim on the concurrency-critical
        # packages (per-shard locking in the root package, the cache, ops, and the
        # vector store). Race runs are heavy: -p 2 avoids the known CPU
        # oversubscription flakiness (see `make test-serial`) and -timeout 40m
        # gives the widened deadlines room. Scoped to these packages rather than
        # ./... to keep the lane within CI's time budget while still exercising
        # every test that carries data-race assertions. gotestsum reruns transient
        # failures (a data race is deterministic and re-fails; a contended-runner
        # timeout is what gets absorbed).
        #
        # -short IS PART OF THE CONTRACT, not a shortcut. The heavy differential
        # suites in vector/ are written to size themselves off it — see
        # filter_bitset_test.go's gateSharedN ("THE SHORT SIZE EXISTS FOR -race")
        # and searchability_invariant_test.go, which size their corpora down but
        # keep every shape — and `make race` has always passed it. This lane did
        # not, so it ran a 30k-point corpus through ~65 filter shapes twice under
        # the detector: the vector package alone went from part of a 606s job in
        # July to blowing the entire 40m budget, and the timeout named whichever
        # test happened to be in flight (which read like a deadlock and was not).
        #
        # What -short costs is corpus SIZE and the recall/measurement tests, which
        # carry no race assertions; what it keeps is every concurrency test —
        # growHammer, the grow/remap hammers, the build-concurrent suites — at
        # full strength, which is the entire point of this lane. The unabridged
        # corpora still run on every push in the `build, vet + unit/light
        # packages` job, without -race.
        run: gotestsum --rerun-fails=2 --packages="./ ./cache/... ./ops/... ./vector/..." -- -race -short -p 2 -timeout 40m
      - name: Tests must not write into the checkout
        # See test-unit for why this exists and why the flags are what they are.
        if: ${{ always() && steps.tree-snapshot.outcome == 'success' }}
        run: |
          git status --porcelain --ignored=traditional --untracked-files=all | sort > /tmp/tree-after.txt
          if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt > /tmp/tree.diff; then
            echo "::error::the test run wrote into the checkout — see the diff below"
            cat /tmp/tree.diff
            exit 1
          fi
          echo "working tree unchanged by the test run"


  python-client:
    name: python client tests
    runs-on: ubuntu-latest
    # Runs in parallel with the Go lanes rather than serialized into them. Most
    # of the suite drives an in-process FakeRostam, but the cross-stack modules
    # need the real server: they assert that the Python client and the Go server
    # agree on a byte-level wire, which a fake cannot prove. Without a binary
    # they skip -- silently -- so this lane builds one. That costs a Go toolchain
    # and one build; the alternative is a cross-language contract no lane checks.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build rostam-server for the cross-stack tests
        run: go build -o rostam-server ./cmd/rostam-server

      - name: Install client with test deps
        # The `test` extra pulls the adapter deps + pytest so the langchain /
        # llamaindex / haystack tests run instead of skipping.
        run: pip install -e "clients/python[test]"

      - name: Pytest
        # -m python runs from clients/python so the `tests` package resolves for
        # both `from tests._fakestore` and bare `from _fakestore` imports.
        # ROSTAM_SERVER_BIN is explicit so the cross-stack modules cannot quietly
        # skip: if the build above produced nothing, they fail rather than pass.
        run: python -m pytest tests
        working-directory: clients/python
        env:
          ROSTAM_SERVER_BIN: ${{ github.workspace }}/rostam-server

  test-sdk-module:
    name: sdk module (standalone, engine-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # GOWORK=off builds/tests the module in isolation, exactly as an external
      # `go get` consumer resolves it -- the committed go.work must not mask a
      # broken per-module go.mod or a re-coupling to the engine.
      - name: Build + test sdk standalone
        working-directory: sdk
        env:
          GOWORK: "off"
        run: |
          go build ./...
          go test ./... -count=1
      - name: sdk imports no non-sdk repo package
        working-directory: sdk
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          deps=$(go list -deps ./...)   # fails the job if go list errors
          if printf '%s\n' "$deps" | grep 'rostamlabs/rostam/' | grep -v '/sdk'; then
            echo "FAIL: sdk leaked a non-sdk repo import"; exit 1
          fi
          echo "PASS: sdk is self-contained"

  test-client-module:
    name: client module (standalone, engine-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build + test client standalone
        working-directory: client
        env:
          GOWORK: "off"
        run: |
          go build ./...
          go test ./... -count=1
      - name: client module graph has NO engine module (the boundary gate)
        working-directory: client
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          # -f '{{.Path}}' prints module PATHS only; `go list -m all` appends the
          # version (and =>replacement), so a plain path match would MISS an
          # engine re-entry like "github.com/rostamlabs/rostam v0.2.0". The
          # command substitution also fails the job if `go list` itself errors.
          paths=$(go list -m -f '{{.Path}}' all)
          if printf '%s\n' "$paths" | grep -qx 'github.com/rostamlabs/rostam'; then
            echo "FAIL: client transitively requires the engine module"; exit 1
          fi
          echo "PASS: client is engine-free"
